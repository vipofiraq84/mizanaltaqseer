<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ميزان التقصير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Field tool for the traffic officer: one task per screen, sticky step header, card stack, fixed action bar.
   Driver A is blue and driver B is orange on every screen so the two never get mixed up. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F3F6F9; --ink:#13222E; --ink-2:#506272; --line:#D3DBE3;
  --brand:#0E3A5C; --on-brand:#FFFFFF;
  --a:#1B5FCC; --a-soft:#E4EDFC; --b:#B25400; --b-soft:#FBEBDA; --on-accent:#FFFFFF;
  --warn-bg:#FFF3D1; --warn-ink:#6A4700; --danger:#B3261E; --ok:#17794A;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-display:"Noto Kufi Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B141C; --surface:#13202B; --surface-2:#1A2935; --ink:#E7EEF4; --ink-2:#9DB1C0; --line:#2A3B48;
    --brand:#8CC4F0; --on-brand:#06223A;
    --a:#7FADFF; --a-soft:#162A4D; --b:#FFA552; --b-soft:#3A2410; --on-accent:#0A1620;
    --warn-bg:#3A2E0C; --warn-ink:#F2D27A; --danger:#FF8F86; --ok:#5CD08E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B141C; --surface:#13202B; --surface-2:#1A2935; --ink:#E7EEF4; --ink-2:#9DB1C0; --line:#2A3B48;
  --brand:#8CC4F0; --on-brand:#06223A;
  --a:#7FADFF; --a-soft:#162A4D; --b:#FFA552; --b-soft:#3A2410; --on-accent:#0A1620;
  --warn-bg:#3A2E0C; --warn-ink:#F2D27A; --danger:#FF8F86; --ok:#5CD08E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font:400 16px/1.65 var(--font-body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin-inline:auto}
.sr{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stitle{margin:0;font:800 19px/1.4 var(--font-display);display:flex;align-items:center;gap:10px;min-width:0}
.scount{font:600 14px var(--font-body);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.seg{height:5px;border-radius:3px;background:var(--line)}
.seg.done{background:var(--brand)}
.seg.cur{background:var(--ink)}

main{padding-block:14px 150px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font:800 20px/1.45 var(--font-display);text-wrap:balance}
.card h3{margin:0;font:600 16px/1.5 var(--font-body)}
.muted{margin:0;color:var(--ink-2);font-size:14px}
.eyebrow{margin:0;font:600 13px var(--font-body);letter-spacing:.04em;color:var(--ink-2)}

.formula{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.formula .term{flex:1 1 90px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink-2)}
.formula .term b{font:800 22px/1.2 var(--font-display);color:var(--ink)}

.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2);min-width:0}
.fld input,.fld textarea{width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
.fld input:focus-visible,.fld textarea:focus-visible,button:focus-visible,.sr:focus-visible + .box,.slide:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap input{padding-inline-end:56px;text-align:center}
.inwrap em{position:absolute;inset-inline-end:12px;font-style:normal;font-size:12px;color:var(--ink-2);pointer-events:none}

.dbadge{flex:none;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:800 17px var(--font-display);background:var(--dc);color:var(--on-accent)}
.dr-a{--dc:var(--a);--dsoft:var(--a-soft)}
.dr-b{--dc:var(--b);--dsoft:var(--b-soft)}
.chead{display:flex;align-items:center;gap:10px;min-width:0}
.chead small{display:block;color:var(--ink-2);font-size:13px;line-height:1.3}
.chead b{display:block;line-height:1.3;overflow-wrap:anywhere}

/* violation rows */
.grp{display:flex;flex-direction:column;gap:8px}
.gh{margin:6px 2px 0;font:600 14px var(--font-body);color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.vitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vitem[data-on="true"]{border-color:var(--dc);background:var(--dsoft)}
.vrow{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 12px;cursor:pointer}
.box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--ink-2);display:inline-flex;align-items:center;justify-content:center;color:transparent}
.vitem[data-on="true"] .box{background:var(--dc);border-color:var(--dc);color:var(--on-accent)}
.vtxt{flex:1;min-width:0;line-height:1.45}
.vtxt small{display:block;color:var(--ink-2);font-size:12.5px}
.vbadge{flex:none;min-width:46px;text-align:center;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font:600 14px var(--font-body);font-variant-numeric:tabular-nums}
.vitem[data-on="true"] .vbadge{background:var(--dc);border-color:var(--dc);color:var(--on-accent)}
.extra{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.calc{margin:0;font-size:14px;color:var(--ink);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.math{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:13.5px;color:var(--ink-2);padding:0 12px 12px}
.opts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.opts.four{grid-template-columns:repeat(4,1fr)}
.opt{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:600 16px var(--font-body);cursor:pointer;font-variant-numeric:tabular-nums}
.opt.on{background:var(--dc);border-color:var(--dc);color:var(--on-accent)}

/* sliders and levels */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv,.kind{min-height:58px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:6px;font:600 14.5px/1.35 var(--font-body);text-align:center}
.lv small,.kind small{font:400 12px var(--font-body);color:var(--ink-2);font-variant-numeric:tabular-nums}
.lv.on,.kind.on{background:var(--dc);border-color:var(--dc);color:var(--on-accent)}
.lv.on small,.kind.on small{color:var(--on-accent)}
.kinds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sliderrow{display:flex;align-items:center;gap:14px}
.slide{flex:1;min-width:0;height:44px;accent-color:var(--dc)}
.bignum{flex:none;min-width:64px;text-align:center;font:800 34px/1 var(--font-display);font-variant-numeric:tabular-nums}
.lvl{margin:0;font-weight:600}
.sug{margin:0;font-size:14px;color:var(--ink-2)}
.q{margin:0;font-weight:600}

/* results */
.split{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--line)}
.split span{display:block;height:100%}
.split .sa{background:var(--a)} .split .sb{background:var(--b)}
.pcts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard .pc{font:800 40px/1.1 var(--font-display);color:var(--dc);font-variant-numeric:tabular-nums}
.pcard .pc sup{font-size:18px}
table.brk{width:100%;border-collapse:collapse;font-size:14px}
table.brk td{padding:6px 0;border-top:1px solid var(--line)}
table.brk td:last-child{text-align:end;font-weight:600;font-variant-numeric:tabular-nums}
table.brk tr.tot td{font-weight:800}
.vl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink-2)}
.vl li{display:flex;justify-content:space-between;gap:10px}
.vl li b{font-variant-numeric:tabular-nums;color:var(--ink)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent;font-size:14px}
.pill{align-self:flex-start;padding:3px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);font-size:13px;font-weight:600}
textarea.copybox{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px;font-size:14px}

/* buttons */
.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 18px;font:600 16px var(--font-body);cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.barin{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.barrow{display:flex;gap:10px;align-items:center}
.barrow .btn.primary{flex:1}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.2;font-size:12px;color:var(--ink-2);min-width:64px}
.chip b{font:800 22px var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.hint{margin:0;font-size:13px;color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:5px 10px}
.toast{position:fixed;inset-inline:16px;bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:7;margin-inline:auto;max-width:320px;text-align:center;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px}
@media (max-width:380px){.pcts{grid-template-columns:1fr}.opts{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app" dir="rtl" lang="ar">
  <header class="top"><div class="wrap" id="top"></div></header>
  <main class="wrap" id="main"></main>
  <footer class="bar"><div class="barin" id="bar"></div></footer>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
//<logic>
var DNAME=['أ','ب'];
var VIOLS=[
 {id:'signal',t:'fixed',tier:200,grp:0,label:'عدم الامتثال لإشارة المرور الضوئية'},
 {id:'officer',t:'fixed',tier:200,grp:0,label:'عدم الامتثال لإشارة رجل المرور'},
 {id:'reckless',t:'fixed',tier:200,grp:0,label:'القيادة بإهمال ورعونة'},
 {id:'highway',t:'fixed',tier:200,grp:0,label:'مخالفة قواعد السير على الطريق السريع'},
 {id:'speed',t:'speed',grp:0,label:'تجاوز السرعة المقررة',note:'200 + 2 × (الفعلية − المقررة)'},
 {id:'instr',t:'fixed',tier:100,grp:1,label:'مخالفة تعليمات مديرية المرور العامة'},
 {id:'phone',t:'fixed',tier:100,grp:1,label:'استعمال الهاتف النقال أثناء القيادة'},
 {id:'uturn',t:'fixed',tier:100,grp:1,label:'الاستدارة من مكان غير مسموح بها'},
 {id:'load',t:'load',grp:1,label:'زيادة الحمولة عن المقررة',note:'100 + درجة واحدة لكل 1% زيادة'},
 {id:'yield',t:'fixed',tier:50,grp:2,label:'عدم إعطاء الأسبقية للمشاة في منطقة العبور'},
 {id:'wrongcat',t:'cat',grp:2,label:'القيادة بإجازة سوق غير مختصة بنوع المركبة',note:'50 + 2 × فرق السن + 2 × فرق تسلسل الفئات'},
 {id:'park',t:'park',grp:2,label:'الوقوف في مكان يُمنع فيه الوقوف',note:'50 + 10 × معامل خطورة الموقع'},
 {id:'nolic',t:'admin',grp:3,label:'قيادة بلا إجازة سوق، أو بإجازة مسحوبة أو ملغاة'},
 {id:'unreg',t:'admin',grp:3,label:'قيادة مركبة غير مسجلة'},
 {id:'drunk',t:'admin',grp:3,label:'القيادة تحت تأثير مسكر أو مخدر'},
 {id:'other',t:'other',grp:4,label:'مخالفة أخرى (تحدد فئتها)'}
];
var LV_AVOID=[{max:0,name:'معدومة',set:0},{max:20,name:'ضعيفة جداً',set:10},{max:40,name:'ضعيفة',set:30},{max:60,name:'متوسطة',set:50},{max:80,name:'مرتفعة',set:70},{max:100,name:'مرتفعة جداً',set:90}];
var LV_RES=[{max:0,name:'معدومة',set:0},{max:20,name:'ضئيلة',set:10},{max:40,name:'خفيفة',set:30},{max:60,name:'متوسطة',set:50},{max:80,name:'جسيمة',set:70},{max:100,name:'فائقة الجسامة',set:90}];
var KINDS=[{k:'none',label:'لا ضرر',v:0},{k:'prop',label:'أضرار مادية فقط',v:10},{k:'light',label:'إصابات خفيفة',v:30},{k:'mid',label:'إصابات متوسطة',v:50},{k:'severe',label:'إصابات بليغة أو عاهة',v:70},{k:'death',label:'وفاة',v:100}];
var QS=['توفر له زمن كافٍ للاستجابة قبل نقطة التصادم','كانت المسافة كافية للتوقف أو المناورة','كان بإمكانه الفرملة أو تغيير المسار أو التنبيه','كانت الرؤية أمامه واضحة','كانت مركبته سليمة وقادرة على التفادي'];

function num(x){ if(x===''||x==null) return null; var n=Number(x); return isFinite(n)?n:null; }
function levelOf(levels,val){ for(var i=0;i<levels.length;i++){ if(val<=levels[i].max) return levels[i]; } return levels[levels.length-1]; }
function vdegree(v,p){
  p=p||{};
  switch(v.t){
    case 'fixed': return v.tier;
    case 'speed': { var l=num(p.limit),a=num(p.speed); if(l==null||a==null||l<=0||a<=0) return null; return 200+2*Math.max(0,a-l); }
    case 'load': { var al=num(p.allowed),ac=num(p.actual); if(al==null||ac==null||al<=0||ac<=0) return null; return 100+Math.floor(Math.max(0,(ac-al)/al*100)); }
    case 'cat': { var y=num(p.age),g=num(p.gap); if(y==null||g==null) return null; return 50+2*Math.max(0,y)+2*Math.max(0,g); }
    case 'park': { if(p.risk==null) return null; return p.risk===0?0:50+10*p.risk; }
    case 'other': return p.tier==null?null:p.tier;
  }
  return 0;
}
function driverJ(d){
  var sum=0,incomplete=false,adm=[],items=[];
  VIOLS.forEach(function(v){
    var e=d.v[v.id]; if(!e||!e.on) return;
    if(v.t==='admin'){ adm.push(v); return; }
    var g=vdegree(v,e.p);
    if(g==null){ incomplete=true; items.push({v:v,deg:null}); } else { sum+=g; items.push({v:v,deg:g}); }
  });
  var applied=adm.length>0&&sum>0;
  adm.forEach(function(v,i){ items.push({v:v,deg:(applied&&i===0)?200:0,admin:true}); });
  return {j:sum+(applied?200:0),incomplete:incomplete,applied:applied,adm:adm,items:items};
}
function calcAll(dr){
  var J=dr.map(driverJ);
  var T=dr.map(function(d){return num(d.avoid.val);});
  var N=dr.map(function(d){return num(d.res.val);});
  var ready=J.every(function(x){return !x.incomplete;})&&T.every(function(x){return x!=null;})&&N.every(function(x){return x!=null;});
  var tot=[0,1].map(function(i){return J[i].j+(T[i]||0)+(N[i]||0);});
  var sum=tot[0]+tot[1];
  var pa=sum>0?tot[0]/sum*100:null;
  return {J:J,T:T,N:N,tot:tot,sum:sum,ready:ready,pct:pa==null?null:[pa,100-pa]};
}
//</logic>

var KEY='mizan-altaqseer-v1';
function nowLocal(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function newDriver(){ return {name:'',plate:'',v:{},avoid:{q:[false,false,false,false,false],val:null,manual:false},res:{val:null}}; }
function freshState(){ return {step:0,example:false,info:{report:'',place:'',dt:nowLocal()},dr:[newDriver(),newDriver()]}; }
var S=freshState();
try{ var raw=localStorage.getItem(KEY); if(raw){ var p=JSON.parse(raw); if(p&&Array.isArray(p.dr)&&p.dr.length===2&&p.info) S=p; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

var STEPS=['بيانات الحادث','مخالفات السائق (أ)','مخالفات السائق (ب)','إمكانية تفادي الحادث','جسامة النتيجة','نسبة التقصير'];
var $app=document.getElementById('app'),$top=document.getElementById('top'),$main=document.getElementById('main'),$bar=document.getElementById('bar'),$toast=document.getElementById('toast');
var CHECK='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function dlabel(d){ return S.dr[d].name.trim()||('السائق ('+DNAME[d]+')'); }
function dc(d){ return d===0?'dr-a':'dr-b'; }
function ensureV(d,id){ var o=S.dr[d].v; if(!o[id]) o[id]={on:false,p:{}}; if(!o[id].p) o[id].p={}; return o[id]; }
function r1(x){ return (Math.round(x*10)/10).toFixed(1); }

/* ---------- rendering ---------- */
function renderTop(){
  var d=(S.step===1)?0:(S.step===2)?1:null;
  var badge=d==null?'':'<span class="dbadge '+dc(d)+'">'+DNAME[d]+'</span>';
  var segs=STEPS.map(function(_,i){return '<span class="seg '+(i<S.step?'done':i===S.step?'cur':'')+'"></span>';}).join('');
  $top.innerHTML='<div class="toprow"><h1 class="stitle">'+badge+'<span>'+STEPS[S.step]+'</span></h1><span class="scount">'+(S.step+1)+' / '+STEPS.length+'</span></div><div class="segs" aria-hidden="true">'+segs+'</div>';
}
function fld(path,label,val,type,ph){
  return '<label class="fld"><span>'+label+'</span><input type="'+(type||'text')+'" data-f="'+path+'" value="'+esc(val)+'" placeholder="'+esc(ph||'')+'"'+(type==='datetime-local'?' dir="ltr"':'')+'></label>';
}
function renderData(){
  var i=S.info;
  var drivers=[0,1].map(function(d){
    return '<div class="card '+dc(d)+'"><div class="chead"><span class="dbadge">'+DNAME[d]+'</span><b>السائق ('+DNAME[d]+')</b></div>'+
      '<div class="row2">'+fld('dr.'+d+'.name','الاسم',S.dr[d].name,'text','اختياري')+fld('dr.'+d+'.plate','رقم المركبة',S.dr[d].plate,'text','اختياري')+'</div></div>';
  }).join('');
  return '<section class="stack">'+

/* ---------- live updates (no re-render, keeps keyboard focus) ---------- */
function live(key){
  var k=key.split('|'), t=k[0], d=+k[1];
  switch(t){
    case 'deg': return badgeText(d,VIOLS.filter(function(v){return v.id===k[2];})[0]);
    case 'calc': return null;
    case 'j': return String(driverJ(S.dr[d]).j);
    case 'avnum': return S.dr[d].avoid.val==null?'—':String(S.dr[d].avoid.val);
    case 'avlvl': return S.dr[d].avoid.val==null?'لم تُحدد بعد':levelOf(LV_AVOID,S.dr[d].avoid.val).name;
    case 'rsnum': return S.dr[d].res.val==null?'—':String(S.dr[d].res.val);
    case 'rslvl': return S.dr[d].res.val==null?'لم تُحدد بعد':levelOf(LV_RES,S.dr[d].res.val).name;
    case 'sug': return String(S.dr[d].avoid.q.filter(Boolean).length*20);
  }
  return null;
}
function refresh(){
  document.querySelectorAll('[data-live]').forEach(function(el){
    var key=el.dataset.live, k=key.split('|');
    if(k[0]==='calc'){ var v=VIOLS.filter(function(x){return x.id===k[2];})[0]; el.innerHTML=calcText(+k[1],v); return; }
    if(k[0]==='adm'){ el.textContent=admNote(+k[1]); return; }
    var s=live(key); if(s!=null) el.textContent=s;
  });
  document.querySelectorAll('[data-lvb]').forEach(function(b){
    var p=b.dataset.lvb.split('|'), a=S.dr[+p[1]].avoid;
    b.classList.toggle('on',a.val!=null&&levelOf(LV_AVOID,a.val)===LV_AVOID[+p[2]]);
  });
  document.querySelectorAll('[data-kb]').forEach(function(b){
    var p=b.dataset.kb.split('|');
    b.classList.toggle('on',S.dr[+p[0]].res.val===KINDS[+p[1]].v);
  });
  var hint=needHint(), h=document.getElementById('hint'), n=document.getElementById('nextBtn');
  if(h){ h.hidden=!hint; h.textContent=hint; }
  if(n) n.disabled=!!hint;
  save();
}

function buildText(){

    var J=c.J[d];

      L.push('- '+it.v.label+extra+' ('+(it.admin&&!it.deg?'لا تُحتسب':it.deg)+')');
    });

$app.addEventListener('click',function(e){

  var a=b.dataset.act, d=+b.dataset.d;
  if(a==='next') go(S.step+1);
  else if(a==='prev') go(S.step-1);
  else if(a==='example') loadExample();
  else if(a==='park'){ S.example=false; ensureV(d,b.dataset.id).p.risk=+b.dataset.v; render(true); }
  else if(a==='tier'){ S.example=false; ensureV(d,b.dataset.id).p.tier=+b.dataset.v; render(true); }
  else if(a==='lv'){ S.example=false; var A=S.dr[d].avoid; A.val=LV_AVOID[+b.dataset.i].set; A.manual=true; render(true); }
  else if(a==='kind'){ S.example=false; S.dr[d].res.val=KINDS[+b.dataset.i].v; render(true); }
  else if(a==='copy') copySummary();
  else if(a==='reset'){
    if(b.dataset.armed){ S=freshState(); go(0); }
    else{ b.dataset.armed='1'; b.textContent='اضغط مرة أخرى لتأكيد المسح'; setTimeout(function(){ if(b.isConnected){ delete b.dataset.armed; b.textContent='بدء حادث جديد'; } },4000); }
  }
});
$app.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.vt){
    S.example=false; var p=t.dataset.vt.split('|'); ensureV(+p[0],p[1]).on=t.checked; render(true);
    var el=document.getElementById(t.id); if(el) el.focus({preventScroll:true});
  } else if(t.dataset.q){
    S.example=false; var q=t.dataset.q.split('|'), A=S.dr[+q[0]].avoid; A.q[+q[1]]=t.checked;
    if(!A.manual) A.val=A.q.filter(Boolean).length*20;
    render(true); var el2=document.getElementById(t.id); if(el2) el2.focus({preventScroll:true});
  }
});
$app.addEventListener('input',function(e){
  var t=e.target; S.example=false;
  if(t.dataset.f){ setPath(t.dataset.f,t.value); save(); return; }
  if(t.dataset.vp){ var p=t.dataset.vp.split('|'); ensureV(+p[0],p[1]).p[p[2]]=t.value; refresh(); return; }
  if(t.dataset.slide){
    var s=t.dataset.slide.split('|'), d=+s[1], v=+t.value;
    if(s[0]==='av'){ S.dr[d].avoid.val=v; S.dr[d].avoid.manual=true; } else { S.dr[d].res.val=v; }
    refresh();
  }
});

render(true);
</script>
</body>
</html>
